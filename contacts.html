<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа — Сахарный цех</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">

    <header style="background: #000; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-weight: bold; font-size: 20px;">САХАРНЫЙ ЦЕХ</div>
        <nav>
            <a href="index.html" style="color: #fff; margin-right: 15px; text-decoration: none;">Главная</a>
            <a href="cakes.html" style="color: #fff; margin-right: 15px; text-decoration: none;">Каталог</a>
            <a href="builder.html" style="color: #fff; margin-right: 15px; text-decoration: none;">Конструктор</a>
            <a href="fillings.html" style="color: #fff; margin-right: 15px; text-decoration: none;">Начинки</a>
            <a href="contacts.html" style="color: #fff; text-decoration: none; border-bottom: 2px solid #fff;">Заказ</a>
        </nav>
    </header>

    <main style="padding: 20px; max-width: 600px; margin: 0 auto;">
        <h1>Оформление заказа</h1>
        
        <form id="orderForm">
            <p>
                <label for="name">Ваше имя (2–60 символов):</label><br>
                <input type="text" id="name" name="name" minlength="2" maxlength="60" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </p>

            <p>
                <label for="phone">Телефон:</label><br>
                <input type="tel" id="phone" name="phone" required style="width: 100%; padding: 8px; margin-top: 5px;" placeholder="+79991234567">
            </p>

            <p>
                <label for="email">E-mail (необязательно):</label><br>
                <input type="email" id="email" name="email" style="width: 100%; padding: 8px; margin-top: 5px;">
            </p>

            <p>
                <label for="cake_type">Выберите торт:</label><br>
                <select id="cake_type" name="cake_type" style="width: 100%; padding: 8px; margin-top: 5px;">
                    <option value="C-01">Новогодний торт C-01</option>
                    <option value="C-02">Детский торт C-02</option>
                    <option value="CUSTOM">Кастомный торт из конструктора</option>
                </select>
            </p>

            <p>
                <label for="weight">Вес торта (кг, шаг 0.5):</label><br>
                <input type="number" id="weight" name="weight" min="1.5" max="10" step="0.5" value="1.5" style="width: 100%; padding: 8px; margin-top: 5px;">
            </p>

            <p>
                <label for="date">Дата выполнения (минимум за 3 дня):</label><br>
                <input type="date" id="date" name="date" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </p>

            <p>
                <input type="checkbox" id="privacy" required checked>
                <label for="privacy">Я согласен на <a href="privacy.html" target="_blank">обработку персональных данных</a></label>
            </p>

            <button type="submit" id="submitBtn" style="padding: 10px 20px; background: #000; color: #fff; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px;">
                Отправить заявку
            </button>
        </form>
    </main>

    <script src="js/analytics.js"></script>
    <script src="js/form.js"></script>
    <script>
        // Автоматическая подстановка минимальной даты (+3 дня от сегодняшней) по ТЗ
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('date');
            const today = new Date();
            today.setDate(today.getDate() + 3);
            const yyyy = today.getFullYear();
            let mm = today.getMonth() + 1;
            let dd = today.getDate();
            if (mm < 10) mm = '0' + mm;
            if (dd < 10) dd = '0' + dd;
            dateInput.min = `${yyyy}-${mm}-${dd}`;
            dateInput.value = `${yyyy}-${mm}-${dd}`;

            // Если пришли из конструктора или калькулятора гостей, подтягиваем сохраненные параметры
            if(sessionStorage.getItem('built_cake_weight')) {
                document.getElementById('weight').value = sessionStorage.getItem('built_cake_weight');
            }
            if(sessionStorage.getItem('built_cake_type')) {
                document.getElementById('cake_type').value = 'CUSTOM';
            }
        });
    </script>
</body>
</html>
