<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">

    <header style="background: #000; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">

        <nav>

                <a href="contacts.html" data-event="cta_click" data-param-button-name="order_c01" data-param-page-section="catalog" style="background: #000; color: #fff; padding: 8px 15px; text-decoration: none; display: inline-block;">Заказать</a>

            <div style="border: 1px solid #ccc; padding: 15px;">

                <a href="contacts.html" data-event="cta_click" data-param-button-name="order_c02" data-param-page-section="catalog" style="background: #000; color: #fff; padding: 8px 15px; text-decoration: none; display: inline-block;">Заказать</a>
